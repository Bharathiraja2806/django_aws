<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>View data</title>
  </head>
  <body>
    <h1>Employee Data</h1>
    <table border="1">
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Mobile</th>
        <th>Department</th>
        <th>Salary</th>
      </tr>
      {% for employee in employees %}
      <tr>
        <td>{{ employee.name }}</td>
        <td>{{ employee.email }}</td>
        <td>{{ employee.phone }}</td>
        <td>{{ employee.department }}</td>
        <td>{{ employee.salary }}</td>
      </tr>
      {% endfor %}
    </table>
  </body>
</html>
